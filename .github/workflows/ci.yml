# InflexHub CI (M0-8): build + unit tests for backend and frontend.
# GitHub Actions sets CI=true, which turns warnings into errors via
# Directory.Build.props.

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend (build + tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore InflexHub.slnx

      - name: Build (warnings as errors)
        run: dotnet build InflexHub.slnx --no-restore --warnaserror

      - name: Test
        run: dotnet test InflexHub.slnx --no-build

  frontend:
    name: Frontend (typecheck + build + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 26
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # Before the unit tests: tests/a11y.test.ts runs axe-core against the
      # prerendered HTML this build produces (V1-32).
      - name: Build
        run: npm run build

      - name: Unit tests
        run: npm test
