# InflexHub local stack (M0-7). Run `docker compose up --build` from the
# repository root; copy .env.example to .env first.
#
# Dev publishes all ports; production (V1.1) publishes only `site` and keeps
# `api` and `db` on the internal network (docs/06-devops/docker-and-environments.md).

services:
  db:
    image: postgres:18.7
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-inflexhub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-inflexhub}
    ports:
      - "5432:5432"
    volumes:
      # postgres 18+ stores data in major-version subdirectories under
      # /var/lib/postgresql; the legacy /var/lib/postgresql/data mount is
      # rejected by the 18.x image (docker-library/postgres#37).
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-inflexhub} -d ${POSTGRES_DB:-inflexhub}"]
      interval: 5s
      timeout: 3s
      retries: 12

  # One-shot: applies EF Core migrations (bundle), then exits.
  # Migrations never run at API startup (golden rule 19).
  migrate:
    build:
      context: .
      dockerfile: src/InflexHub.Api/Dockerfile
      target: migrator
    # The bundle re-hosts the app, so it needs the connection string as an
    # environment variable too; --connection is what the applier uses.
    environment:
      ConnectionStrings__Default: ${API_CONNECTION_STRING:?Set API_CONNECTION_STRING in .env}
    command: ["--connection", "${API_CONNECTION_STRING:?Set API_CONNECTION_STRING in .env}"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      dockerfile: src/InflexHub.Api/Dockerfile
      target: api
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ConnectionStrings__Default: ${API_CONNECTION_STRING:?Set API_CONNECTION_STRING in .env}
      Site__ApiKey: ${SITE_API_KEY:?Set SITE_API_KEY in .env}
      # Consumed from V1-19/V1-26 onward; wired now so environments stay uniform.
      Privacy__IpHashSalt: ${PRIVACY_IP_HASH_SALT:-}
      Admin__ExportKey: ${ADMIN_EXPORT_KEY:-}
    ports:
      - "8080:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully

  site:
    build:
      context: .
      dockerfile: web/apps/site/Dockerfile
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
    environment:
      # Server-only (ADR 0004): the route handler forwards with this key.
      API_BASE_URL: http://api:8080
      SITE_API_KEY: ${SITE_API_KEY:?Set SITE_API_KEY in .env}
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  pgdata:
